workflows:
  qr-attendance-android:
    name: QR Attendance Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 1.8
      node: 10.15.3
      vars:
        CI: "true"

    scripts:
      - name: Install React Native dependencies
        script: |
          cd app
          npm ci

      - name: Fix fsevents and install watchman
        script: |
          cd app
          npm install --no-save fsevents@1.2.13 || true
          node -e "require('fsevents'); console.log('fsevents OK')" || echo "fsevents still unavailable"
          brew install watchman || true
          watchman --version || echo "watchman not installed"

      - name: Convert node_modules to AndroidX (jetify)
        script: |
          cd app
          npm install --no-save jetifier@1.6.8
          npx jetify

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/app/android/local.properties"

      - name: Build Android APK
        script: |
          cd app/android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

    artifacts:
      - app/android/app/build/outputs/apk/**/*.apk
